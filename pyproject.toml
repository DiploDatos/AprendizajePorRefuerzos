[project]
name = "aprendizaje-por-refuerzos"
version = "2026.0.0"
description = "Entorno reproducible del curso de Aprendizaje por Refuerzos de DiploDatos"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Juan Cruz Barsce", email = "jbarsce@gmail.com" },
    { name = "Jorge Palombarini", email = "palombarini@gmail.com" },
    { name = "Ezequiel Beccaria", email = "ezequielbeccaria@gmail.com" },
]
dependencies = [
    "gymnasium[classic-control,toy-text]==1.2.1",
    "stable-baselines3==2.7.0",
    "numpy==2.3.4",
    "matplotlib==3.10.7",
    "torch==2.9.0",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "tqdm==4.67.1",
    "ipykernel==7.1.0",
    "jupyterlab==4.4.10",
    # Pygame 2.6.1 usa pkg_resources, eliminado en setuptools 81.
    "setuptools==80.9.0",
]

[project.optional-dependencies]
tp-hf = ["transformers==4.57.1", "accelerate==1.11.0"]

[dependency-groups]
dev = ["nbclient==0.10.2", "nbformat==5.10.4"]

[tool.uv]
package = false
required-version = "==0.9.2"
# CPU en Linux/Windows; macOS ARM usa la distribución oficial de PyPI.
# Jetson necesita su propio stack JetPack y no usa este entorno.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
